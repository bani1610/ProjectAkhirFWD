name: Frontend

on:
  push:
    paths: ['fe-react/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['fe-react/**', '.github/workflows/frontend.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe-react

    steps:
      - uses: actions/checkout@v4

      # Versi pnpm diambil dari "packageManager" di fe-react/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: fe-react/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fe-react/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
